# Drop-in: start Docker only after Tailscale has an IPv4 address, because
# pi/docker-compose.yml publishes n8n on the Tailscale IP. Without this, n8n
# can fail at boot with "cannot assign requested address".
# Install:
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp scripts/systemd/docker-wait-for-tailscale.conf /etc/systemd/system/docker.service.d/
#   sudo systemctl daemon-reload

[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
# Wait up to 60s for the address; continue anyway so Docker always starts.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 2; done; exit 0'
