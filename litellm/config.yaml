# LiteLLM proxy config: local Ollama on dorkmini first, free-tier clouds second.
#
# Clients ask for a *model group* (local-chat, local-small, local-embed). If the
# local deployment errors, times out or is cooling down, LiteLLM walks the
# fallback chain below. All keys come from env vars (os.environ/...), never this
# file. Free-tier model IDs and limits change often: verify them before relying
# on the numbers (see litellm/README.md).

model_list:
  # --- Local (dorkmini) ----------------------------------------------------
  - model_name: local-chat
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 120
  - model_name: local-small
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 60
  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text-v2-moe
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      mode: embedding

  # --- Free-tier fallbacks -------------------------------------------------
  # rpm/tpm are set at or below the published free-tier ceilings so the router
  # weights and skips deployments before the provider starts returning 429s.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 8
      tpm: 200000
  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 25
      tpm: 10000
  - model_name: cerebras-llama
    litellm_params:
      model: cerebras/llama3.1-8b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 25
      tpm: 50000
  - model_name: openrouter-free
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 15

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true   # skip deployments whose context window is too small
  num_retries: 1
  timeout: 120
  # Never hammer a provider that already said 429: go straight to the fallback.
  retry_policy:
    RateLimitErrorRetries: 0
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
  allowed_fails: 2                # failures per minute before a cooldown
  cooldown_time: 120              # seconds a failing deployment is skipped
  fallbacks:
    - local-chat: [gemini-flash, groq-llama, cerebras-llama, openrouter-free]
    - local-small: [groq-llama, cerebras-llama, gemini-flash, openrouter-free]

litellm_settings:
  drop_params: true               # ignore params a provider does not support
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
